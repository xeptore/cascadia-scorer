name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: pnpm run format

      - name: Fail on formatting drift
        run: pnpm run drift:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Check Svelte and TypeScript
        run: pnpm run check

      - name: Check PWA icons
        run: pnpm run icons:check

      - name: Run tests
        run: pnpm run test

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Ensure verification leaves the checkout clean
        run: pnpm run drift:check

  build:
    name: Production build
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build application
        run: pnpm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Verify PWA build
        run: pnpm run pwa:check
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Ensure build verification leaves the checkout clean
        run: pnpm run drift:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  publish:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.0
